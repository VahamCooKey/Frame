# Frame - mpv input.conf
#
# Dual purpose file:
#   1. Parsed directly by mpv as key bindings.
#   2. Scanned by MenuBuilder for the in-app menu: trailing "#menu: A > B"
#      comments define the menu path of the binding's command. Lines without
#      "#menu:" are still valid mpv bindings (mpv parses this file itself).
#
# Format: <key> <mpv command>   #menu: Section > Item
# Key names must match ShortcutManager::toMpvKeyName output.
# Root menu order follows first appearance below: File, Playback, Audio,
# Subtitles, View (window, panels), Picture (image and captures).

o script-message app-open-file          #menu: File > Open...
Ctrl+u script-message app-open-url      #menu: File > Open URL...
Ctrl+v script-message app-open-clipboard #menu: File > Open from Clipboard
Ctrl+, script-message app-settings      #menu: File > Settings...
F1 script-message app-shortcut-guide    #menu: File > Keyboard Shortcuts
Alt+p script-message app-speed-menu     #menu: Playback > Playback Speed...
Alt+a script-message app-audio-menu     #menu: Audio > Choose Track...
Alt+c script-message app-subtitle-menu  #menu: Subtitles > Choose Track...
Alt+o script-message app-playback-menu  #menu: View > Quick Settings...

SPACE cycle pause                       #menu: Playback > Play/Pause
LEFT seek -5                            #menu: Playback > Seek > Back 5 s
RIGHT seek 5                            #menu: Playback > Seek > Forward 5 s
Alt+j seek -10                          #menu: Playback > Seek > Back 10 s
Alt+l seek 10                           #menu: Playback > Seek > Forward 10 s
Ctrl+RIGHT script-message app-frame-step-forward
Ctrl+LEFT script-message app-frame-step-back
Shift+LEFT seek -30                     #menu: Playback > Seek > Back 30 s
Shift+RIGHT seek 30                     #menu: Playback > Seek > Forward 30 s
Ctrl+Shift+LEFT seek -90                #menu: Playback > Seek > Back 90 s
Ctrl+Shift+RIGHT seek 90                #menu: Playback > Seek > Forward 90 s
UP add volume 5                         #menu: Audio > Volume Up
DOWN add volume -5                      #menu: Audio > Volume Down
= add volume 5                          #menu: Audio > Volume Up
- add volume -5                         #menu: Audio > Volume Down
# Speed (F36): J/L step the speed by 0.25x, Backspace resets it and K
# plays/pauses -- the JKL layout of video editors. L is also intercepted
# QML-side (ShortcutManager A15): holding it bursts to 2.5x / 5x / 8x
# (double/triple-click-and-hold) and reverts on release. [ and ] are
# older aliases for the same steps.
j script-message app-shuttle-down       #menu: Playback > Speed > Slower
l script-message app-shuttle-up         #menu: Playback > Speed > Faster
BS set speed 1.0                        #menu: Playback > Speed > Normal Speed
[ script-message app-shuttle-down
] script-message app-shuttle-up
k cycle pause
Shift+l script-message app-loop-file    #menu: Playback > Loop Video
b script-message app-ab-in              #menu: Playback > A-B Loop > Set A
Shift+b script-message app-ab-out       #menu: Playback > A-B Loop > Set B
Alt+b script-message app-ab-clear       #menu: Playback > A-B Loop > Clear
Ctrl+g script-message app-goto-time     #menu: Playback > Seek > Go to Time...
Ctrl+t script-message app-cycle-time-display  #menu: View > Time Display
Ctrl+d script-message app-bookmark-add  #menu: Playback > Add Bookmark
Ctrl+h script-message app-chapters     #menu: Playback > Chapters...
Ctrl+i script-message app-playback-info #menu: View > Playback Info...
p script-message app-toggle-playlist    #menu: View > Toggle Playlist
# Single keys for the common action: PgUp/PgDn change video; chapters
# (rarer, and absent from most files) take the Shift variants.
PGUP playlist-prev                      #menu: Playback > Previous Video
PGDWN playlist-next                     #menu: Playback > Next Video
Shift+PGUP add chapter -1               #menu: Playback > Previous Chapter
Shift+PGDWN add chapter 1               #menu: Playback > Next Chapter
> playlist-next
< playlist-prev
0 seek 0 absolute-percent               #menu: Playback > Jump to Start
HOME seek 0 absolute-percent

m cycle mute                            #menu: Audio > Mute
a cycle audio                           #menu: Audio > Next Track
Ctrl+[ add audio-delay -0.1             #menu: Audio > Audio Delay -
Ctrl+] add audio-delay 0.1              #menu: Audio > Audio Delay +
Ctrl+BS set audio-delay 0               #menu: Audio > Audio Delay Reset

c script-message app-subtitle-cycle     #menu: Subtitles > Cycle Subtitle
v cycle sub-visibility                  #menu: Subtitles > Subtitle On/Off
Alt+s script-message app-load-subtitles      #menu: Subtitles > Load Subtitle File...
Alt+LEFT sub-seek -1                    #menu: Subtitles > Previous Subtitle
Alt+RIGHT sub-seek 1                    #menu: Subtitles > Next Subtitle
z add sub-delay -0.1                    #menu: Subtitles > Delay -
x add sub-delay 0.1                     #menu: Subtitles > Delay +

f script-message app-toggle-fullscreen  #menu: View > Fullscreen
t script-message app-toggle-theater     #menu: View > Theater Layout
Ctrl+Shift+m script-message app-mini-player  #menu: Window > Mini Player
Ctrl+Shift+t script-message app-always-on-top #menu: Window > Always on Top
Alt+0 script-message app-window-scale 0.5    #menu: Window > Half Size
Alt+1 script-message app-window-scale 1      #menu: Window > Video Size
Alt+2 script-message app-window-scale 2      #menu: Window > Double Size
Shift+s script-message app-shader-dialog           #menu: Picture > Apply Shader...
Ctrl+r cycle-values video-rotate 90 180 270 0    #menu: Picture > Rotate
s screenshot                            #menu: Picture > Screenshot
Ctrl+s script-message app-screenshot-clipboard  #menu: Picture > Copy Frame
Ctrl+a script-message app-cycle-aspect    #menu: Picture > Aspect Ratio
Ctrl+= script-message app-zoom-in       #menu: Picture > Zoom In
Ctrl+- script-message app-zoom-out      #menu: Picture > Zoom Out
Ctrl+0 script-message app-zoom-reset    #menu: Picture > Zoom Reset

, frame-back-step
. frame-step
q script-message app-quit
ESC script-message app-escape

# Hardware media keys (laptop keyboards / remotes). ShortcutManager maps the
# Qt key codes to these mpv names; they carry no #menu: comment on purpose.
PLAYPAUSE cycle pause
PLAY set pause no
PAUSE set pause yes
STOP stop
PREV playlist-prev
NEXT playlist-next

WHEEL_UP add volume 5
WHEEL_DOWN add volume -5
