<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#eee);font:14px var(--font-sans,Segoe UI,sans-serif)}.preview{padding:24px;border-radius:var(--radius,12px);background:#151515;color:#f1f1f1;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}.preview.light{background:#e7e6e3;color:#202020}.hero{width:100%;max-width:280px;display:block;margin:auto}.name{font-size:20px;font-weight:600;letter-spacing:-.4px;margin:0 0 5px}.detail{margin:0 0 22px;opacity:.65;line-height:1.5}.sizes{display:flex;gap:20px;align-items:end}.sample{display:grid;justify-items:center;gap:8px}.sample img{display:block}.sample span{font-size:11px;opacity:.65}.controls{display:flex;gap:6px;margin-top:16px}button{border:1px solid var(--border,#333);background:transparent;color:inherit;border-radius:7px;padding:7px 12px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--secondary,#282828)}button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media(max-width:460px){.preview{grid-template-columns:1fr;gap:0;text-align:center}.hero{max-width:220px}.sizes,.controls{justify-content:center}}
</style></head><body><div id="preview" class="preview"><img class="hero" src="frame-player-icon-v1.svg" alt="Frame icon: rounded charcoal screen with a white play symbol"><div><p class="name">Frame</p><p class="detail">SVG · 633 bytes<br>Editable vector shapes</p><div class="sizes"><div class="sample"><img src="frame-player-icon-v1.svg" width="16" height="16" alt="Frame icon at 16 pixels"><span>16 px</span></div><div class="sample"><img src="frame-player-icon-v1.svg" width="24" height="24" alt="Frame icon at 24 pixels"><span>24 px</span></div><div class="sample"><img src="frame-player-icon-v1.svg" width="32" height="32" alt="Frame icon at 32 pixels"><span>32 px</span></div><div class="sample"><img src="frame-player-icon-v1.svg" width="48" height="48" alt="Frame icon at 48 pixels"><span>48 px</span></div></div></div></div><div class="controls" role="group" aria-label="Preview background"><button type="button" aria-pressed="true" onclick="setTheme(false)">Dark background</button><button type="button" aria-pressed="false" onclick="setTheme(true)">Light background</button></div><script>function setTheme(light){document.getElementById('preview').classList.toggle('light',light);document.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===(light?1:0))))}Promise.all([...document.images].map(img=>img.decode())).then(()=>console.log('All 5 SVG samples decoded successfully.')).catch(e=>console.error(e.message));</script></body></html>
