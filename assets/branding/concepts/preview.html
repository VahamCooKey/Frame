<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#f5f5f5);font:14px var(--font-sans,Segoe UI,sans-serif)}
.preview{padding:24px;border-radius:var(--radius,12px);background:#151515;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;color:#f1f1f1}
.preview.light{background:#e7e6e3;color:#202020}
.hero{display:block;width:100%;max-width:350px;margin:auto}
p{margin:0 0 18px;line-height:1.5}.label{font-size:20px;font-weight:600;letter-spacing:-.4px;margin-bottom:4px}.sub{opacity:.65}
.sizes{display:flex;align-items:flex-end;gap:24px}.sample{display:grid;justify-items:center;gap:8px}.sample span{font-size:11px;opacity:.65}.sample img{display:block}
.controls{display:flex;gap:6px;margin:16px 0 0}button{border:1px solid var(--border,#333);background:transparent;color:inherit;border-radius:7px;padding:7px 12px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--secondary,#282828)}button:focus-visible{outline:2px solid var(--foreground,#eee);outline-offset:2px}
@media(max-width:460px){.preview{grid-template-columns:1fr;gap:6px;text-align:center}.hero{max-width:240px}.sizes{justify-content:center}.controls{justify-content:center}}
</style></head><body><div id="preview" class="preview"><img class="hero" src="frame-player-icon-v1.png" alt="A charcoal rounded screen with a rounded white play symbol at its center"><div><p class="label">Frame</p><p class="sub">Rounded screen. Centered play.</p><div class="sizes"><div class="sample"><img src="frame-player-icon-v1.png" width="24" alt="Icon at 24 pixels"><span>24 px</span></div><div class="sample"><img src="frame-player-icon-v1.png" width="32" alt="Icon at 32 pixels"><span>32 px</span></div><div class="sample"><img src="frame-player-icon-v1.png" width="48" alt="Icon at 48 pixels"><span>48 px</span></div></div></div></div><div class="controls" role="group" aria-label="Preview background"><button type="button" aria-pressed="true" onclick="setTheme(false)">Dark background</button><button type="button" aria-pressed="false" onclick="setTheme(true)">Light background</button></div><script>function setTheme(light){document.getElementById('preview').classList.toggle('light',light);document.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===(light?1:0))))}console.log('Icon preview: original transparent PNG, 24/32/48 px samples.');</script></body></html>
